---
bugfixes:
  - >-
    Fixed labels and notification_templates not being applied when defined directly
    in user data because the Jinja2 expressions checked ``related.*`` (API-exported
    format) before the direct user value. Reordered the fallback chain to check the
    direct value first, matching the existing correct pattern used by ``credentials``.
    Affected roles - controller_job_templates, controller_schedules,
    controller_workflow_job_templates, controller_projects,
    controller_inventory_sources, controller_organizations, gateway_organizations
    (https://github.com/redhat-cop/infra.aap_configuration/issues/1270).

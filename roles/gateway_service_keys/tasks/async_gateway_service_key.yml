---
- name: async_gateway_service_key | An async_gateway_service_key block
  block:
    - name: async_gateway_service_key | Managing Service Key | Wait for finish the service key operation
      ansible.builtin.async_status:
        jid: "{{ __gateway_service_keys_job_async_results_item.ansible_job_id }}"
      register: __gateway_service_keys_job_async_result
      until: __gateway_service_keys_job_async_result.finished
      retries: "{{ gateway_service_keys_async_retries }}"
      delay: "{{ gateway_service_keys_async_delay }}"
  rescue:
    - name: async_gateway_service_key | Load error details
      ansible.builtin.include_vars:
        file: "{{ __gateway_service_keys_job_async_result.results_file }}"
        name: __error_data

    - name: async_gateway_service_key | Show error and stop execution
      when: not collect_logs
      ansible.builtin.fail:
        msg: "error: {{ __error_data['msg'] }}, response: {{ __error_data['response'] | default ('N/A') }}"

    - name: async_gateway_service_key | Building list of not processed service keys
      ansible.builtin.set_fact:
        __gateway_service_key_error_list: "{{ __gateway_service_keys_error_list | default([]) + [
                                                                                  {
                                                                                   'name': __error_data['invocation']['module_args']['name'] | default(''),
                                                                                   'error': __error_data['msg'] | default('')
                                                                                  }
                                                                                 ]
                                         }}"
...
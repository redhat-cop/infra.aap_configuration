---
- name: async_eda_event_stream | An async_eda_event_stream block
  block:
    - name: async_eda_event_stream | Managing EDA event stream | Wait for finish the EDA event stream management
      ansible.builtin.async_status:
        jid: "{{ __event_streams_job_async_result_item.ansible_job_id }}"
      register: __event_streams_job_async_result
      until: __event_streams_job_async_result.finished
      retries: "{{ eda_configuration_event_streams_async_retries }}"
      delay: "{{ eda_configuration_event_streams_async_delay }}"
  rescue:
    - name: async_eda_event_stream | Load error details
      ansible.builtin.include_vars:
        file: "{{ __event_streams_job_async_result.results_file }}"
        name: __error_data

    - name: async_eda_event_stream | Show error and stop execution
      when: not collect_logs
      ansible.builtin.fail:
        msg: "error: {{ __error_data['msg'] }}, response: {{ __error_data['response'] | default ('N/A') }}"

    - name: async_eda_event_stream | Building list of not processed EDA event stream
      ansible.builtin.set_fact:
        __eda_event_stream_error_list: "{{ __eda_event_stream_error_list | default([]) + [
                                                                     {
                                                                        'name': __error_data['invocation']['module_args']['name'] | default(''),
                                                                        'error': __error_data['msg'] | default('')
                                                                     }
                                                                   ]
                                           }}"
...

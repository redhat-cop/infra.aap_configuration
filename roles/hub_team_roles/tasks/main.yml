---
# Add Team Roles
- name: Manage Hub Team Roles Block
  vars:
    ansible_async_dir: "{{ aap_configuration_async_dir }}"
  no_log: "{{ hub_configuration_team_roles_secure_logging }}"
  block:
    - name: Add Roles to Teams in Automation Hubs
      ansible.hub.team_roles:
        team: "{{ __hub_team_roles_item.team }}"
        organization: "{{ __hub_team_roles_item.organization | default(omit) }}"
        role: "{{ __hub_team_roles_item.role }}"
        targets: "{{ __hub_team_roles_item.targets | default(omit) }}"
        state: "{{ __hub_team_roles_item.state | default(hub_state | default(ah_state | default('present'))) }}"
        ah_host: "{{ aap_hostname | default(omit) }}"
        ah_username: "{{ aap_username | default(omit) }}"
        ah_password: "{{ aap_password | default(omit) }}"
        ah_token: "{{ hub_token | default(omit) }}"
        ah_path_prefix: "{{ hub_path_prefix | default(ah_path_prefix | default(omit)) }}"
        validate_certs: "{{ aap_validate_certs | default(omit) }}"
        request_timeout: "{{ aap_request_timeout | default(10, true) }}"
      loop: "{{ hub_team_roles }}"
      loop_control:
        loop_var: __hub_team_roles_item
        label: "{{ __operation.verb }} the role {{ __hub_team_roles_item.role }} for team {{ __hub_team_roles_item.team }} in Hub"
        pause: "{{ hub_configuration_team_roles_loop_delay }}"
      async: "{{ ansible_check_mode | ternary(0, hub_configuration_team_roles_async_timeout) }}"
      poll: 0
      register: __team_roles_job_async
      changed_when: (__team_roles_job_async.changed if ansible_check_mode else false)
      vars:
        __operation: "{{ operation_translate[__hub_team_roles_item.state | default(platform_state) | default('present')] }}"

    - name: Flag for errors (check mode only)
      ansible.builtin.set_fact:
        error_flag: true
      when: ansible_check_mode and __team_roles_job_async.failed is defined and __team_roles_job_async.failed

    - name: Add Roles to Teams | Wait for finish the team role assignment
      when:
        - not ansible_check_mode
        - __team_roles_job_async_result_item.ansible_job_id is defined
      ansible.builtin.include_role:
        name: infra.aap_configuration.collect_async_status
      loop: "{{ __team_roles_job_async.results }}"
      loop_control:
        loop_var: __team_roles_job_async_result_item
        label: "{{ __operation.verb }} Team role {{ __team_roles_job_async_result_item.__hub_team_roles_item.role }} for {{ __team_roles_job_async_result_item.__hub_team_roles_item.team }} | Wait for finish the Team role {{ __operation.action }}"
      vars:
        cas_secure_logging: "{{ hub_configuration_team_roles_secure_logging }}"
        cas_async_delay: "{{ hub_configuration_team_roles_async_delay }}"
        cas_async_retries: "{{ hub_configuration_team_roles_async_retries }}"
        cas_job_async_results_item: "{{ __team_roles_job_async_result_item }}"
        cas_register_subvar: hub_team_roles
        cas_error_list_var_name: "hub_team_roles_errors"
        __operation: "{{ operation_translate[__team_roles_job_async_result_item.__hub_team_roles_item.state | default(platform_state) | default('present')] }}"
        cas_object_label: "{{ __operation.verb }} Team role {{ __team_roles_job_async_result_item.__hub_team_roles_item.role }} for {{ __team_roles_job_async_result_item.__hub_team_roles_item.team }} | Wait for finish the Team role {{ __operation.action }}"

  always:
    - name: Cleanup async results files
      when:
        - not ansible_check_mode
        - __team_roles_job_async_result_item.ansible_job_id is defined
      ansible.builtin.async_status:
        jid: "{{ __team_roles_job_async_result_item.ansible_job_id }}"
        mode: cleanup
      loop: "{{ __team_roles_job_async.results }}"
      loop_control:
        loop_var: __team_roles_job_async_result_item
        label: "Cleaning up job results file: {{ __team_roles_job_async_result_item.results_file | default('Unknown') }}"
...

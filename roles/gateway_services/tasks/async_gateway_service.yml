---
- name: async_gateway_service | An async_gateway_service block
  block:
    - name: async_gateway_service | Managing Service | Wait for finish the service operation
      ansible.builtin.async_status:
        jid: "{{ __gateway_services_job_async_results_item.ansible_job_id }}"
      register: __gateway_services_job_async_result
      until: __gateway_services_job_async_result.finished
      retries: "{{ gateway_services_async_retries }}"
      delay: "{{ gateway_services_async_delay }}"
  rescue:
    - name: async_gateway_service | Load error details
      ansible.builtin.include_vars:
        file: "{{ __gateway_services_job_async_result.results_file }}"
        name: __error_data

    - name: async_gateway_service | Show error and stop execution
      when: not collect_logs
      ansible.builtin.fail:
        msg: "error: {{ __error_data['msg'] }}, response: {{ __error_data['response'] | default ('N/A') }}"

    - name: async_gateway_service | Building list of not processed service
      ansible.builtin.set_fact:
        __gateway_service_error_list: "{{ __gateway_services_error_list | default([]) + [
                                                                                  {
                                                                                   'name': __error_data['invocation']['module_args']['name'] | default(''),
                                                                                   'error': __error_data['msg'] | default('')
                                                                                  }
                                                                                 ]
                                         }}"
...

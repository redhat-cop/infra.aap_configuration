---
- name: async_hub_group_role | An async_hub_group_role block
  block:
    - name: async_hub_group_role | Managing hub group role | Wait for finish the hub group role operation
      ansible.builtin.async_status:
        jid: "{{ __group_roles_job_async_result_item.ansible_job_id }}"
      register: __group_roles_job_async_result
      until: __group_roles_job_async_result.finished
      retries: "{{ hub_configuration_group_roles_async_retries }}"
      delay: "{{ hub_configuration_group_roles_async_delay }}"
  rescue:
    - name: async_hub_group_role | Load error details
      ansible.builtin.include_vars:
        file: "{{ __group_roles_job_async_result.results_file }}"
        name: __error_data

    - name: async_hub_group_role | Show error and stop execution
      when: not collect_logs
      ansible.builtin.fail:
        msg: "error: {{ __error_data['msg'] }}, response: {{ __error_data['response'] | default ('N/A') }}"

    - name: async_hub_group_role | Building list of not processed hub group role
      ansible.builtin.set_fact:
        __hub_group_role_error_list: "{{ __hub_group_role_error_list | default([]) + [
                                                                            {
                                                                             'name': __error_data['invocation']['module_args']['name'] | default(''),
                                                                             'error': __error_data['msg'] | default('')
                                                                            }
                                                                           ]
                                }}"
...

---
argument_specs:
  main:
    short_description: An Ansible Role to create namespaces in Automation Hub.
    options:
      hub_namespaces:
        default: []
        required: false
        description: Data structure describing your namespaces to manage.
        type: list
        elements: dict

      # Async variables
      hub_configuration_namespace_async_retries:
        default: "{{ aap_configuration_async_retries | default(50) }}"
        required: false
        description: This variable sets the number of retries to attempt for the role.
      aap_configuration_async_retries:
        default: 50
        required: false
        description: This variable sets number of retries across all roles as a default.
      hub_configuration_namespace_async_delay:
        default: "{{ aap_configuration_async_delay | default(1) }}"
        required: false
        description: This variable sets delay between retries for the role.
      aap_configuration_async_delay:
        default: 1
        required: false
        description: This variable sets delay between retries across all roles as a default.
      aap_configuration_async_dir:
        default: null
        required: false
        description: Sets the directory to write the results file for async tasks. The default value is set to  `null` which uses the Ansible Default of `/root/.ansible_async/`.

      hub_configuration_namespace_async_timeout:
        default: "{{ aap_configuration_async_timeout | default(1000) }}"
        required: false
        description: Asynchronous task timeout for the role.
      hub_configuration_namespace_loop_delay:
        default: "{{ aap_configuration_loop_delay | default(0) }}"
        required: false
        description: Pause between each item in the loop for the role.
      aap_configuration_async_timeout:
        default: 1000
        required: false
        description: This variable sets the default asynchronous task timeout across all roles.
      aap_configuration_loop_delay:
        default: 0
        required: false
        description: This variable sets the default pause between loop items across all roles.

      # No_log variables
      hub_configuration_namespace_secure_logging:
        default: "{{ aap_configuration_secure_logging | default(false) }}"
        required: false
        type: bool
        description: Whether to hide sensitive task output for this role.
      aap_configuration_secure_logging:
        default: false
        required: false
        type: bool
        description: Whether to hide sensitive task output across roles.

      aap_configuration_collect_logs:
        default: false
        required: false
        type: bool
        description: Collect async results and continue after failed tasks instead of failing on the first error.
      aap_configuration_register:
        default: ""
        required: false
        type: str
        description: Variable to register results from this role.

      # Generic across all roles
      aap_hostname:
        default: None
        required: false
        description: URL to the Ansible Automation Platform Server.
        type: str
      hub_path_prefix:
        required: false
        description: The path for the Automation Hub API. Usually galaxy or automation-hub unless custom set in AH settings.
      aap_validate_certs:
        default: true
        required: false
        description: Whether or not to validate the Ansible Automation Platform Server's SSL certificate.
        type: str
      aap_request_timeout:
        default: 10
        required: false
        description: Specify the timeout Ansible should use in requests to the Ansible Automation Platform Server.
        type: raw
      aap_username:
        default: None
        required: false
        description: Admin User on the Ansible Automation Platform Server. Either username / password or oauthtoken need to be specified.
        type: str
      aap_password:
        default: None
        required: false
        description: Controller Admin User's password on the Ansible Automation Platform Server. This should be stored in an Ansible Vault at vars/controller-secrets.yml or elsewhere and called from a parent playbook. Either username / password or oauthtoken need to be specified.
        type: str
      hub_token:
        default: None
        required: false
        description: Controller Admin User's token on the Ansible Automation Platform Server. This should be stored in an Ansible Vault at or elsewhere and called from a parent playbook. Either username / password or oauthtoken need to be specified.
        type: str
...

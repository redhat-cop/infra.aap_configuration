#          state:
#            default: "{{ platform_state | default('present') }}"
#            required: false
#            type: str
#            description: Desired state of the application.

      # Async variables
      applications_async_retries:
        default: "{{ aap_configuration_async_retries | default(50) }}"
        required: false
        description: This variable sets the number of retries to attempt for the role.
      aap_configuration_async_retries:
        default: 50
        required: false
        description: This variable sets number of retries across all roles as a default.
      applications_async_delay:
        default: "{{ aap_configuration_async_delay | default(1) }}"
        required: false
        description: This variable sets delay between retries for the role.
      aap_configuration_async_delay:
        default: 1
        required: false
        description: This variable sets delay between retries across all roles as a default.
      aap_configuration_async_dir:
        default: null
        required: false
        description: Sets the directory to write the results file for async tasks. The default value is set to `null` which uses the Ansible Default of `/root/.ansible_async/`.

      gateway_applications_async_retries:
        default: "{{ aap_configuration_async_retries | default(50) }}"
        required: false
        description: Number of asynchronous result checks for the role.
      gateway_applications_async_delay:
        default: "{{ aap_configuration_async_delay | default(1) }}"
        required: false
        description: Delay between asynchronous result checks for the role.
      aap_applications_loop_delay:
        default: "{{ aap_configuration_loop_delay | default(0) }}"
        required: false
        description: Pause between each item in the loop for the role.
      aap_configuration_loop_delay:
        default: 0
        required: false
        description: This variable sets the default pause between loop items across all roles.

      # No_log variables
      gateway_applications_secure_logging:
        default: "{{ aap_configuration_secure_logging | default('false') }}"
        required: false
        type: bool
        description: Whether to hide sensitive task output for this role.
      aap_configuration_secure_logging:
        default: false
        required: false
        type: bool
        description: Whether to hide sensitive task output across roles.

      gateway_applications_enforce_defaults:
        default: "{{ aap_configuration_enforce_defaults | default(false) }}"
        required: false
        type: bool
        description: Whether to supply default values for omitted optional fields in this role.
      aap_configuration_enforce_defaults:
        default: false
        required: false
        type: bool
        description: Whether to supply default values for omitted optional fields in this role.

      aap_request_timeout:
        default: 10
        required: false
        type: raw
        description: Specify the timeout in seconds Ansible should use in requests to the controller host.
      aap_configuration_collect_logs:
        default: false
        required: false
        type: bool
        description: Collect async results and continue after failed tasks instead of failing on the first error.
      aap_configuration_register:
        default: ""
        required: false
        type: str
        description: Variable to register results from this role.

      # Generic across all roles
      platform_state:
        default: present
        required: false
        description: The state all objects will take unless overridden by object default
        type: str
      aap_hostname:
        default: None
        required: false
        description: URL to the Ansible gateway Server.
        type: str
      aap_validate_certs:
        default: true
        required: false
        description: Whether or not to validate the Ansible gateway Server's SSL certificate.
        type: str
      aap_username:
        default: None
        required: false
        description: Admin User on the Ansible gateway Server. Either username / password or oauthtoken need to be specified.
        type: str
      aap_password:
        default: None
        required: false
        description: Gateway Admin User's password on the Ansible gateway Server. This should be stored in an Ansible Vault at vars/gateway-secrets.yml or elsewhere and called from a parent playbook. Either username / password or oauthtoken need to be specified.
        type: str
      aap_token:
        default: None
        required: false
        description: Gateway Admin User's token on the Ansible gateway Server. This should be stored in an Ansible Vault at or elsewhere and called from a parent playbook. Either username / password or oauthtoken need to be specified.
        type: str
...

---
- name: async_hub_collection_repository_sync | An async_hub_collection_repository sync block
  block:
    - name: async_hub_collection_repository_sync | Managing hub collection repository sync | Wait for finish the hub collection repository sync operation
      ansible.builtin.async_status:
        jid: "{{ __collection_repository_sync_job_async_result_item.ansible_job_id }}"
      register: __collection_repository_sync_job_async_result
      until: __collection_repository_sync_job_async_result.finished
      retries: "{{ hub_configuration_collection_repository_sync_async_retries }}"
      delay: "{{ hub_configuration_collection_repository_sync_async_delay }}"
  rescue:
    - name: async_hub_collection_repository_sync | Load error details
      ansible.builtin.include_vars:
        file: "{{ __collection_repository_sync_job_async_result.results_file }}"
        name: __error_data

    - name: async_hub_collection_repository_sync | Show error and stop execution
      when: not collect_logs
      ansible.builtin.fail:
        msg: "error: {{ __error_data['msg'] }}, response: {{ __error_data['response'] | default ('N/A') }}"

    - name: async_hub_collection_repository_sync | Building list of not processed hub collection repository
      ansible.builtin.set_fact:
        __hub_collection_repository_sync_error_list: "{{ __hub_collection_repository_sync_error_list | default([]) + [
                                                                                  {
                                                                                   'name': __error_data['invocation']['module_args']['name'] | default(''),
                                                                                   'error': __error_data['msg'] | default('')
                                                                                  }
                                                                                 ]
                                                     }}"
...

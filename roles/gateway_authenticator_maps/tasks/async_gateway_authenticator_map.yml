---
- name: async_gateway_authenticator_map | An async_gateway_authenticator_map block
  block:
    - name: async_gateway_authenticator_map | Managing Gateway Applications | Wait for finish the applications management
      ansible.builtin.async_status:
        jid: "{{ __gateway_authenticator_maps_job_async_results_item.ansible_job_id }}"
      register: __gateway_authenticator_maps_job_async_result
      until: __gateway_authenticator_maps_job_async_result.finished
      retries: "{{ gateway_authenticator_maps_async_retries }}"
      delay: "{{ gateway_authenticator_maps_async_delay }}"
  rescue:
    - name: async_gateway_authenticator_map | Load error details
      ansible.builtin.include_vars:
        file: "{{ __gateway_authenticator_maps_job_async_result.results_file }}"
        name: __error_data

    - name: async_gateway_authenticator_map | Show error and stop execution
      when: not collect_logs
      ansible.builtin.fail:
        msg: "error: {{ __error_data['msg'] }}, response: {{ __error_data['response'] | default ('N/A') }}"

    - name: async_gateway_authenticator_map | Building list of not processed applications
      ansible.builtin.set_fact:
        __gateway_authenticator_maps_error_list: "{{ __gateway_authenticator_maps_error_list | default([]) + [
                                                                                  {
                                                                                   'name': __error_data['invocation']['module_args']['name'] | default(''),
                                                                                   'error': __error_data['msg'] | default('')
                                                                                  }
                                                                                 ]
                                   }}"
...
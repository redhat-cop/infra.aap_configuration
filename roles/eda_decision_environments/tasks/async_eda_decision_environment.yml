---
- name: async_eda_decision_environment | An async_eda_decision_environment block
  block:
    - name: async_eda_decision_environment | Managing EDA decision environments | Wait for finish the EDA decision environments management
      ansible.builtin.async_status:
        jid: "{{ __decision_environments_job_async_result_item.ansible_job_id }}"
      register: __decision_environments_job_async_result
      until: __decision_environments_job_async_result.finished
      retries: "{{ eda_configuration_decision_environments_async_retries }}"
      delay: "{{ eda_configuration_decision_environments_async_delay }}"
  rescue:
    - name: async_eda_decision_environment | Load error details
      ansible.builtin.include_vars:
        file: "{{ __decision_environments_job_async_result.results_file }}"
        name: __error_data

    - name: async_eda_decision_environment | Show error and stop execution
      when: not collect_logs
      ansible.builtin.fail:
        msg: "error: {{ __error_data['msg'] }}, response: {{ __error_data['response'] | default ('N/A') }}"

    - name: async_eda_decision_environment | Building list of not processed EDA decision environments
      ansible.builtin.set_fact:
        __eda_decision_environment_error_list: "{{ __eda_decision_environment_error_list | default([]) + [
                                                                     {
                                                                        'name': __error_data['invocation']['module_args']['name'] | default(''),
                                                                        'error': __error_data['msg'] | default('')
                                                                     }
                                                                   ]
                                           }}"
...

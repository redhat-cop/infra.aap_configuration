---
argument_specs:
  main:
    short_description: An Ansible Role to create users on automation platform gateway.
    options:
      aap_user_accounts:
        description: Data structure describing your users
        type: list
        required: true
        elements: dict
        # options:
        #   username:
        #     required: true
        #     type: str
        #     description: Username of user
        #   password:
        #     required: true
        #     type: str
        #     description: Password of user, defaults to "{{ users_default_password }}" if not set
        #   email:
        #     required: false
        #     type: str
        #     description: email of the user
        #   first_name:
        #     required: false
        #     type: str
        #     description: first_name of the user
        #   last_name:
        #     required: false
        #     type: str
        #     description: last_name of the user
        #   is_superuser:
        #     default: false
        #     required: false
        #     type: bool
        #     description: Whether the user is a superuser
        #   is_platform_auditor:
        #     default: false
        #     required: false
        #     type: bool
        #     description: Whether the user is a platform auditor
        #   update_secrets:
        #     default: true
        #     required: false
        #     type: bool
        #     description: >
        #       true will always change password if user specifies password, even if API gives $encrypted$ for password.
        #       false will only set the password if other values change too.
        #   organization:
        #     required: false
        #     type: str
        #     description: Organization this user belongs to.
        #   authenticators:
        #     required: false
        #     type: list
        #     description: Authenticators this user is associated with
        #   authenticator_uid:
        #     required: false
        #     type: str
        #     description: The uid associated with the users authenticators
        #   state:
        #     default: "{{ platform_state | default('present') }}"
        #     required: false
        #     type: str
        #     description: Desired state of the resource.

      users_default_password:
        default: None
        required: false
        type: str
        description: Global variable to set the password for all users.

      # Async variables
      gateway_users_async_retries:
        default: "{{ aap_configuration_async_retries | default(50) }}"
        required: false
        description: This variable sets the number of retries to attempt for the role.
      aap_configuration_async_retries:
        default: 50
        required: false
        description: This variable sets number of retries across all roles as a default.
      gateway_users_async_delay:
        default: "{{ aap_configuration_async_delay | default(1) }}"
        required: false
        description: This variable sets delay between retries for the role.
      aap_configuration_async_delay:
        default: 1
        required: false
        description: This variable sets delay between retries across all roles as a default.
      aap_configuration_async_dir:
        default: null
        required: false
        description: Sets the directory to write the results file for async tasks. The default value is set to `null` which uses the Ansible Default of `~/.ansible_async`.

      gateway_users_loop_delay:
        default: "{{ aap_configuration_loop_delay | default(0) }}"
        required: false
        description: Pause between each item in the loop for the role.
      aap_configuration_loop_delay:
        default: 0
        required: false
        description: This variable sets the default pause between loop items across all roles.

      # No_log variables
      gateway_users_secure_logging:
        default: "{{ aap_configuration_secure_logging | default('false') }}"
        required: false
        type: bool
        description: Whether to hide sensitive task output for this role.
      aap_configuration_secure_logging:
        default: true
        required: false
        type: bool
        description: Whether to hide sensitive task output across roles.

      aap_request_timeout:
        default: 10
        required: false
        type: raw
        description: Specify the timeout in seconds Ansible should use in requests to the controller host.
      aap_configuration_collect_logs:
        default: false
        required: false
        type: bool
        description: Collect async results and continue after failed tasks instead of failing on the first error.
      aap_configuration_register:
        default: ""
        required: false
        type: str
        description: Variable to register results from this role.

      # Generic across all roles
      platform_state:
        default: present
        required: false
        description: The state all objects will take unless overridden by object default
        type: str
      aap_hostname:
        default: None
        required: false
        description: URL to the Ansible Automation Platform Server.
        type: str
      aap_validate_certs:
        default: true
        required: false
        description: Whether or not to validate the Ansible Automation Platform Server's SSL certificate.
        type: str
      aap_username:
        default: None
        required: false
        description: Admin User on the Ansible Automation Platform Server. Either username / password or oauthtoken need to be specified.
        type: str
      aap_password:
        default: None
        required: false
        description: Controller Admin User's password on the Ansible Automation Platform Server. This should be stored in an Ansible Vault at vars/controller-secrets.yml or elsewhere and called from a parent playbook. Either username / password or oauthtoken need to be specified.
        type: str
      aap_token:
        default: None
        required: false
        description: Controller Admin User's token on the Ansible Automation Platform Server. This should be stored in an Ansible Vault at or elsewhere and called from a parent playbook. Either username / password or oauthtoken need to be specified.
        type: str
...

---
- name: async_hub_publish | An async_hub_publish block
  block:
    - name: async_hub_publish | Managing hub publish | Wait for finish the hub publish operation
      ansible.builtin.async_status:
        jid: "{{ __publish_job_async_result_item.ansible_job_id }}"
      register: __publish_job_async_result
      until: __publish_job_async_result.finished
      retries: "{{ hub_configuration_publish_async_retries }}"
      delay: "{{ hub_configuration_publish_async_delay }}"
  rescue:
    - name: async_hub_publish | Load error details
      ansible.builtin.include_vars:
        file: "{{ __publish_job_async_result.results_file }}"
        name: __error_data

    - name: async_hub_publish | Show error and stop execution
      when: not collect_logs
      ansible.builtin.fail:
        msg: "error: {{ __error_data['msg'] }}, response: {{ __error_data['response'] | default ('N/A') }}"

    - name: async_hub_publish | Building list of not processed hub publish
      ansible.builtin.set_fact:
        __hub_publish_error_list: "{{ __hub_publish_error_list | default([]) + [
                                                                            {
                                                                             'name': __error_data['invocation']['module_args']['name'] | default(''),
                                                                             'error': __error_data['msg'] | default('')
                                                                            }
                                                                           ]
                                }}"
...
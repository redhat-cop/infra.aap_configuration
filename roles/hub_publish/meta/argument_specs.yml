---
argument_specs:
  main:
    short_description: An Ansible Role to publish collections in Automation Hub.
    options:
      aap_configuration_working_dir:
        default: /var/tmp
        type: str
        required: false
        description: The working directory where the built artifacts live, or where the artifacts will be built.
      hub_auto_approve:
        default: false
        type: bool
        required: false
        description: Whether the collection will be automatically approved in Automation Hub. This will only work if the account being used has correct privileges.
      hub_overwrite_existing:
        default: false
        type: bool
        required: false
        description: Whether the collection will be automatically overwrite an existing collection in Automation Hub. This will only work if the account being used has correct privileges.
      hub_skip_existing_collections:
        default: true
        type: bool
        required: false
        description: Skip clone, build, and upload when the collection version already exists in Automation Hub. Set hub_overwrite_existing to true to force re-publishing.
      hub_collections:
        default: []
        required: false
        description: Data structure describing your collections, mutually exclusive to hub_collection_list
        type: list
        elements: dict
        options:
          collection_name:
            type: str
            required: true
            description: Name of collection, normally the last part before the / in a git url.
          git_url:
            type: str
            required: false
            description: Url to git repo. Required if collection_local_path not set.
          version:
            type: str
            required: false
            description: Git ref to pull. Will default to default branch if unset.
          key_path:
            type: str
            required: false
            description: Path to ssh key for authentication.
          ssh_opts:
            type: str
            required: false
            description: Options git will pass to ssh when used as protocol.
          collection_local_path:
            type: str
            required: false
            description: Path to collection stored locally. Required if git_url not set.
          namespace:
            type: str
            required: false
            description: Collection namespace. Enables pre-clone skip checks when set with name and collection_version.
          name:
            type: str
            required: false
            description: Collection name. Enables pre-clone skip checks when set with namespace and collection_version.
          collection_version:
            type: str
            required: false
            description: Collection version from galaxy.yml. Enables pre-clone skip checks when set with namespace and name.
          overwrite_existing:
            type: bool
            required: false
            description: Per-item override of hub_overwrite_existing.
          force:
            type: bool
            required: false
            description: Alias for per-item overwrite_existing true.
      hub_collection_list:
        default: []
        required: false
        description: Data structure file paths to pre built collections, mutually exclusive with hub_collections.
        type: list
        elements: str

      # Async variables
      hub_configuration_publish_async_retries:
        default: "{{ aap_configuration_async_retries | default(50) }}"
        required: false
        description: This variable sets the number of retries to attempt for the role.
      aap_configuration_async_retries:
        default: 50
        required: false
        description: This variable sets number of retries across all roles as a default.
      hub_configuration_publish_async_delay:
        default: "{{ aap_configuration_async_delay | default(1) }}"
        required: false
        description: This variable sets delay between retries for the role.
      aap_configuration_async_delay:
        default: 1
        required: false
        description: This variable sets delay between retries across all roles as a default.
      aap_configuration_async_dir:
        default: null
        required: false
        description: Sets the directory to write the results file for async tasks. The default value is set to  `null` which uses the Ansible Default of `/root/.ansible_async/`.

      # No_log variables
      hub_configuration_publish_secure_logging:
        default: "{{ aap_configuration_secure_logging | default(false) }}"
        required: false
        type: bool
        description: Whether or not to include the sensitive role tasks in the log. Set this value to `true` if you will be providing your sensitive values from elsewhere.
      aap_configuration_secure_logging:
        default: false
        required: false
        type: bool
        description: This variable enables secure logging across all roles as a default.

      # Generic across all roles
      aap_hostname:
        default: None
        required: false
        description: URL to the Ansible Automation Platform Server.
        type: str
      hub_path_prefix:
        required: false
        description: The path for the Automation Hub API. Usually galaxy or automation-hub unless custom set in AH settings.
      aap_validate_certs:
        default: true
        required: false
        description: Whether or not to validate the Ansible Automation Platform Server's SSL certificate.
        type: str
      aap_request_timeout:
        default: 10
        required: false
        description: Specify the timeout Ansible should use in requests to the Ansible Automation Platform Server.
        type: float
      aap_username:
        default: None
        required: false
        description: Admin User on the Ansible Automation Platform Server. Either username / password or oauthtoken need to be specified.
        type: str
      aap_password:
        default: None
        required: false
        description: Controller Admin User's password on the Ansible Automation Platform Server. This should be stored in an Ansible Vault at vars/controller-secrets.yml or elsewhere and called from a parent playbook. Either username / password or oauthtoken need to be specified.
        type: str
...

---
argument_specs:
  main:
    short_description: An Ansible Role to create instance groups on Ansible Controller.
    options:
      controller_instance_groups:
        description: Data structure describing your instance_groups
        type: list
        elements: dict
#        options:
#          name:
#            required: true
#            type: str
#            description: Name of instance group
#          new_name:

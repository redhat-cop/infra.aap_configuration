---
- name: async_eda_rulebook_activation | An async_eda_rulebook_activation block
  block:
    - name: async_eda_rulebook_activation | Managing EDA Rulebook Activations | Wait for finish the EDA rulebook activations management
      ansible.builtin.async_status:
        jid: "{{ __rulebook_activations_job_async_result_item.ansible_job_id }}"
      register: __rulebook_activations_job_async_result
      until: __rulebook_activations_job_async_result.finished
      retries: "{{ eda_configuration_rulebook_activations_async_retries }}"
      delay: "{{ eda_configuration_rulebook_activations_async_delay }}"
  rescue:
    - name: async_eda_rulebook_activation | Load error details
      ansible.builtin.include_vars:
        file: "{{ __rulebook_activations_job_async_result.results_file }}"
        name: __error_data

    - name: async_eda_rulebook_activation | Show error and stop execution
      when: not collect_logs
      ansible.builtin.fail:
        msg: "error: {{ __error_data['msg'] }}, response: {{ __error_data['response'] | default ('N/A') }}"

    - name: async_eda_rulebook_activation | Building list of not processed EDA rulebook activations
      ansible.builtin.set_fact:
        __eda_rulebook_activation_error_list: "{{ __eda_rulebook_activation_error_list | default([]) + [
                                                                          {
                                                                           'name': __error_data['invocation']['module_args']['name'] | default(''),
                                                                           'error': __error_data['msg'] | default('')
                                                                          }
                                                                         ]
                               }}"
...
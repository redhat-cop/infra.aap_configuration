---
- name: async_hub_collection_remote | An async_hub_collection_remote block
  block:
    - name: async_hub_collection_remote | Managing hub collection remote | Wait for finish the hub collection remote operation
      ansible.builtin.async_status:
        jid: "{{ __collection_remote_job_async_result_item.ansible_job_id }}"
      register: __collection_remote_job_async_result
      until: __collection_remote_job_async_result.finished
      retries: "{{ hub_configuration_collection_remote_async_retries }}"
      delay: "{{ hub_configuration_collection_remote_async_delay }}"
  rescue:
    - name: async_hub_collection_remote | Load error details
      ansible.builtin.include_vars:
        file: "{{ __collection_remote_job_async_result.results_file }}"
        name: __error_data

    - name: async_hub_collection_remote | Show error and stop execution
      when: not collect_logs
      ansible.builtin.fail:
        msg: "error: {{ __error_data['msg'] }}, response: {{ __error_data['response'] | default ('N/A') }}"

    - name: async_hub_collection_remote | Building list of not processed hub collection remote
      ansible.builtin.set_fact:
        __hub_collection_remote_error_list: "{{ __hub_collection_remote_error_list | default([]) + [
                                                                                  {
                                                                                   'name': __error_data['invocation']['module_args']['name'] | default(''),
                                                                                   'error': __error_data['msg'] | default('')
                                                                                  }
                                                                                 ]
                                            }}"
...

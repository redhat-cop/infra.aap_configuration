---
- name: async_eda_credential_type | An async_eda_credential_type block
  block:
    - name: async_eda_credential_type | Managing EDA Credential Types | Wait for finish the EDA credential types management
      ansible.builtin.async_status:
        jid: "{{ __credential_types_job_async_result_item.ansible_job_id }}"
      register: __credential_types_job_async_result
      until: __credential_types_job_async_result.finished
      retries: "{{ eda_configuration_credential_types_async_retries }}"
      delay: "{{ eda_configuration_credential_types_async_delay }}"
  rescue:
    - name: async_eda_credential_type | Load error details
      ansible.builtin.include_vars:
        file: "{{ __credential_types_job_async_result.results_file }}"
        name: __error_data

    - name: async_eda_credential_type | Show error and stop execution
      when: not collect_logs
      ansible.builtin.fail:
        msg: "error: {{ __error_data['msg'] }}, response: {{ __error_data['response'] | default ('N/A') }}"

    - name: async_eda_credential_type | Building list of not processed EDA credential types
      ansible.builtin.set_fact:
        __eda_credential_type_error_list: "{{ __eda_credential_type_error_list | default([]) + [
                                                                     {
                                                                        'name': __error_data['invocation']['module_args']['name'] | default(''),
                                                                        'error': __error_data['msg'] | default('')
                                                                     }
                                                                   ]
                                           }}"
...

---
- name: async_eda_credential | An async_eda_credential block
  block:
    - name: async_eda_credential | Managing EDA Credentials | Wait for finish the EDA credentials management
      ansible.builtin.async_status:
        jid: "{{ __credentials_job_async_result_item.ansible_job_id }}"
      register: __credentials_job_async_result
      until: __credentials_job_async_result.finished
      retries: "{{ eda_configuration_credential_types_async_retries }}"
      delay: "{{ eda_configuration_credential_types_async_delay }}"
  rescue:
    - name: async_eda_credential | Load error details
      ansible.builtin.include_vars:
        file: "{{ __credentials_job_async_result.results_file }}"
        name: __error_data

    - name: async_eda_credential | Show error and stop execution
      when: not collect_logs
      ansible.builtin.fail:
        msg: "error: {{ __error_data['msg'] }}, response: {{ __error_data['response'] | default ('N/A') }}"

    - name: async_eda_credential | Building list of not processed EDA credentials
      ansible.builtin.set_fact:
        __eda_controller_token_error_list: "{{ __eda_controller_token_error_list | default([]) + [
                                                                     {
                                                                        'name': __error_data['invocation']['module_args']['name'] | default(''),
                                                                        'error': __error_data['msg'] | default('')
                                                                     }
                                                                   ]
                                           }}"
...

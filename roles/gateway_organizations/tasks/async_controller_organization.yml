- name: async_controller_organization | An async_controller_organization block
  block:
    - name: async_controller_organization | Managing Gateway Organizations | Wait for finish the organization management
      ansible.builtin.async_status:
        jid: "{{ __organizations_job_async_results_item.ansible_job_id }}"
      register: __organizations_job_async_result
      until: __organizations_job_async_result.finished
      retries: "{{ gateway_organization_async_retries }}"
      delay: "{{ gateway_organization_async_delay }}"
  rescue:
    - name: async_controller_organization | Load error details
      ansible.builtin.include_vars:
        file: "{{ __gateway_organization_job_async_result.results_file }}"
        name: __error_data

    - name: async_controller_organization | Show error and stop execution
      when: not collect_logs
      ansible.builtin.fail:
        msg: "error: {{ __error_data['msg'] }}, response: {{ __error_data['response'] | default ('N/A') }}"

    - name: async_controller_organization | Building list of not processed organizations
      ansible.builtin.set_fact:
        __controller_organization_error_list: "{{ __controller_organization_error_list | default([]) + [
                                                                                  {
                                                                                   'organization': __error_data['invocation']['module_args']['organization'] | default(''),
                                                                                   'error': __error_data['msg'] | default('')
                                                                                  }
                                                                                 ]
                                              }}"
...

---
- name: async_eda_controller_token | An async_eda_controller_token block
  block:
    - name: async_eda_controller_token | Managing EDA Controller Tokens | Wait for finish the EDA controller tokens management
      ansible.builtin.async_status:
        jid: "{{ __controller_tokens_job_async_result_item.ansible_job_id }}"
      register: __controller_tokens_job_async_result
      until: __controller_tokens_job_async_result.finished
      retries: "{{ eda_configuration_users_token_async_retries }}"
      delay: "{{ eda_configuration_users_token_async_delay }}"
  rescue:
    - name: async_eda_controller_token | Load error details
      ansible.builtin.include_vars:
        file: "{{ __controller_tokens_job_async_result.results_file }}"
        name: __error_data

    - name: async_eda_controller_token | Show error and stop execution
      when: not collect_logs
      ansible.builtin.fail:
        msg: "error: {{ __error_data['msg'] }}, response: {{ __error_data['response'] | default ('N/A') }}"

    - name: async_eda_controller_token | Building list of not processed EDA controller tokens
      ansible.builtin.set_fact:
        __eda_controller_token_error_list: "{{ __eda_controller_token_error_list | default([]) + [
                                                                     {
                                                                        'name': __error_data['invocation']['module_args']['name'] | default(''),
                                                                        'error': __error_data['msg'] | default('')
                                                                     }
                                                                   ]
                                           }}"
...

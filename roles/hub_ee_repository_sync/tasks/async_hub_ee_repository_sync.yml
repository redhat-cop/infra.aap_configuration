---
- name: async_hub_ee_repository_sync | An async_hub_ee_repository_sync block
  block:
    - name: async_hub_ee_repository_sync | Managing hub ee repository_sync | Wait for finish the hub ee repository sync operation
      ansible.builtin.async_status:
        jid: "{{ __ee_repository_syncs_job_async_result_item.ansible_job_id }}"
      register: __ee_repository_syncs_job_async_result
      until: __ee_repository_syncs_job_async_result.finished
      retries: "{{ hub_configuration_ee_repository_sync_async_retries }}"
      delay: "{{ hub_configuration_ee_repository_sync_async_delay }}"
  rescue:
    - name: async_hub_ee_repository_sync | Load error details
      ansible.builtin.include_vars:
        file: "{{ __ee_repository_syncs_job_async_result.results_file }}"
        name: __error_data

    - name: async_hub_ee_repository_sync | Show error and stop execution
      when: not collect_logs
      ansible.builtin.fail:
        msg: "error: {{ __error_data['msg'] }}, response: {{ __error_data['response'] | default ('N/A') }}"

    - name: async_hub_ee_repository_sync | Building list of not processed hub ee repository sync
      ansible.builtin.set_fact:
        __hub_ee_repository_sync_error_list: "{{ __hub_ee_repository_sync_error_list | default([]) + [
                                                                                  {
                                                                                   'name': __error_data['invocation']['module_args']['name'] | default(''),
                                                                                   'error': __error_data['msg'] | default('')
                                                                                  }
                                                                                 ]
                                            }}"
...

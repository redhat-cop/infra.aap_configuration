---
# list of dicts describing Controller users
aap_user_accounts: []
# Password applied to any entry in aap_user_accounts that does not set one of its own.
# Empty by default: a configuration run should not invent a credential, and a literal shipped
# here is the same password on every installation that uses this role. Set it only if you want
# that, and note that ansible.controller.user defaults update_secrets to true, so a non-empty value is
# re-applied to accounts that already have a password.
# A new account still needs a password of its own: the controller API rejects creating a local
# user without one.
controller_user_default_password: ""

controller_configuration_users_secure_logging: "{{ aap_configuration_secure_logging | default('true') }}"
controller_configuration_users_async_retries: "{{ aap_configuration_async_retries | default(50) }}"
controller_configuration_users_async_delay: "{{ aap_configuration_async_delay | default(1) }}"
controller_configuration_users_loop_delay: "{{ aap_configuration_loop_delay | default(0) }}"
aap_configuration_async_dir:
controller_configuration_users_enforce_defaults: "{{ aap_configuration_enforce_defaults | default(false) }}"
...

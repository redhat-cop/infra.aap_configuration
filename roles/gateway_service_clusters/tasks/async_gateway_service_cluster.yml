---
- name: async_gateway_service_cluster | An async_gateway_service_cluster block
  block:
    - name: async_gateway_service_cluster | Managing Service Cluster | Wait for finish the service cluster operation
      ansible.builtin.async_status:
        jid: "{{ __gateway_service_clusters_job_async_results_item.ansible_job_id }}"
      register: __gateway_service_clusters_job_async_result
      until: __gateway_service_clusters_job_async_result.finished
      retries: "{{ gateway_service_clusters_async_retries }}"
      delay: "{{ gateway_service_clusters_async_delay }}"
  rescue:
    - name: async_gateway_service_cluster | Load error details
      ansible.builtin.include_vars:
        file: "{{ __gateway_service_clusters_job_async_result.results_file }}"
        name: __error_data

    - name: async_gateway_service_cluster | Show error and stop execution
      when: not collect_logs
      ansible.builtin.fail:
        msg: "error: {{ __error_data['msg'] }}, response: {{ __error_data['response'] | default ('N/A') }}"

    - name: async_gateway_service_cluster | Building list of not processed service clusters
      ansible.builtin.set_fact:
        __gateway_service_cluster_error_list: "{{ __gateway_service_cluster_error_list | default([]) + [
                                                                                  {
                                                                                   'name': __error_data['invocation']['module_args']['name'] | default(''),
                                                                                   'error': __error_data['msg'] | default('')
                                                                                  }
                                                                                 ]
                                         }}"
...

---
# tasks file for gateway_settings
- name: Update automation platform gateway Settings
  ansible.platform.settings:
    settings: "{{ gateway_settings | default(omit, true) }}"

    # Role Standard Options
    gateway_hostname: "{{ aap_hostname | default(lookup('env', 'CONTROLLER_HOST'), true) | default(omit, true) }}"
    gateway_username: "{{ aap_username | default(lookup('env', 'CONTROLLER_USERNAME'), true) | default(omit, true) }}"
    gateway_password: "{{ aap_password | default(lookup('env', 'CONTROLLER_PASSWORD'), true) | default(omit, true) }}"
    gateway_token: "{{ aap_token | default(lookup('env', 'CONTROLLER_OAUTH_TOKEN'), true) | default(omit, true) }}"
    gateway_request_timeout: "{{ aap_request_timeout | default(omit, true) }}"
    gateway_validate_certs: "{{ aap_validate_certs | default(omit) }}"
  no_log: "{{ gateway_settings_secure_logging }}"
  register: __gateway_setting_job
...

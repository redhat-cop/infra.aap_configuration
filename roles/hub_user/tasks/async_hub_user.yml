---
- name: async_hub_user | An async_hub_user block
  block:
    - name: async_hub_user | Managing hub user | Wait for finish the hub user operation
      ansible.builtin.async_status:
        jid: "{{ __users_job_async_result_item.ansible_job_id }}"
      register: __users_job_async_result
      until: __users_job_async_result.finished
      retries: "{{ hub_configuration_user_async_retries }}"
      delay: "{{ hub_configuration_user_async_delay }}"
  rescue:
    - name: async_hub_user | Load error details
      ansible.builtin.include_vars:
        file: "{{ __users_job_async_result.results_file }}"
        name: __error_data

    - name: async_hub_user | Show error and stop execution
      when: not collect_logs
      ansible.builtin.fail:
        msg: "error: {{ __error_data['msg'] }}, response: {{ __error_data['response'] | default ('N/A') }}"

    - name: async_hub_user | Building list of not processed hub user
      ansible.builtin.set_fact:
        __hub_user_error_list: "{{ __hub_user_error_list | default([]) + [
                                                                            {
                                                                             'name': __error_data['invocation']['module_args']['name'] | default(''),
                                                                             'error': __error_data['msg'] | default('')
                                                                            }
                                                                           ]
                                }}"
...
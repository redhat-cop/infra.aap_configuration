---
argument_specs:
  main:
    short_description: An Ansible Role to run a list of ad hoc commands on Ansible Controller.
    options:
      controller_bulk_hosts:
        default: []
        required: false
        description: Data structure describing a bulk of hosts to run
        type: list
        elements: dict

      # Async variables
      aap_configuration_async_dir:
        default: null
        required: false
        description: Sets the directory to write the results file for async tasks. The default value is set to `null` which uses the Ansible Default of `/root/.ansible_async/`.

      controller_configuration_bulk_hosts_async_retries:
        default: "{{ aap_configuration_async_retries | default(50) }}"
        required: false
        description: Number of asynchronous result checks for the role.
      controller_configuration_bulk_hosts_async_delay:
        default: "{{ aap_configuration_async_delay | default(1) }}"
        required: false
        description: Delay between asynchronous result checks for the role.
      controller_configuration_bulk_hosts_loop_delay:
        default: "{{ aap_configuration_loop_delay | default(0) }}"
        required: false
        description: Pause between each item in the loop for the role.
      aap_configuration_async_delay:
        default: 1
        required: false
        description: This variable sets the default delay between asynchronous result checks across all roles.
      aap_configuration_async_retries:
        default: 50
        required: false
        description: This variable sets the default number of retries across all roles.
      aap_configuration_loop_delay:
        default: 0
        required: false
        description: This variable sets the default pause between loop items across all roles.

      # No_log variables
      controller_configuration_bulk_hosts_secure_logging:
        default: "{{ aap_configuration_secure_logging | default('false') }}"
        required: false
        type: bool
        description: Whether to hide sensitive task output for this role.
      aap_configuration_secure_logging:
        default: false
        required: false
        type: bool
        description: Whether to hide sensitive task output across roles.

      aap_configuration_collect_logs:
        default: false
        required: false
        type: bool
        description: Collect async results and continue after failed tasks instead of failing on the first error.
      aap_configuration_register:
        default: ""
        required: false
        type: str
        description: Variable to register results from this role.

      # Generic across all roles
      aap_hostname:
        default: None
        required: false
        description: URL to the Ansible Controller Server.
        type: str
      aap_validate_certs:
        default: true
        required: false
        description: Whether or not to validate the Ansible Controller Server's SSL certificate.
        type: str
      aap_request_timeout:
        default: 10
        required: false
        description: Specify the timeout in seconds Ansible should use in requests to the Controller.
        type: int
      aap_username:
        default: None
        required: false
        description: Admin User on the Ansible Controller Server. Either username / password or oauthtoken need to be specified.
        type: str
      aap_password:
        default: None
        required: false
        description: Controller Admin User's password on the Ansible Controller Server. This should be stored in an Ansible Vault at vars/controller-secrets.yml or elsewhere and called from a parent playbook. Either username / password or oauthtoken need to be specified.
        type: str
      aap_token:
        default: None
        required: false
        description: Controller Admin User's token on the Ansible Controller Server. This should be stored in an Ansible Vault at or elsewhere and called from a parent playbook. Either username / password or oauthtoken need to be specified.
        type: str
...

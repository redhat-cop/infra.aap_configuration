---
- name: async_gateway_routes | An async_gateway_routes block
  block:
    - name: async_gateway_routes | Managing Gateway Routes | Wait for finish the gateway route assignment
      ansible.builtin.async_status:
        jid: "{{ __gateway_routes_job_async_results_item.ansible_job_id }}"
      register: __gateway_routes_job_async_result
      until: __gateway_routes_job_async_result.finished
      retries: "{{ gateway_routes_async_retries }}"
      delay: "{{ gateway_routes_async_delay }}"
  rescue:
    - name: async_gateway_routes | Load error details
      ansible.builtin.include_vars:
        file: "{{ __gateway_routes_job_async_result.results_file }}"
        name: __error_data

    - name: async_gateway_routes | Show error and stop execution
      when: not collect_logs
      ansible.builtin.fail:
        msg: "error: {{ __error_data['msg'] }}, response: {{ __error_data['response'] | default ('N/A') }}"

    - name: async_gateway_routes | Building list of not processed gateway routes
      ansible.builtin.set_fact:
        __gateway_routes_error_list: "{{ __gateway_routes_error_list | default([]) + [
                                                                                  {
                                                                                   'name': __error_data['invocation']['module_args']['name'] | default(''),
                                                                                   'error': __error_data['msg'] | default('')
                                                                                  }
                                                                                 ]
                                         }}"
...

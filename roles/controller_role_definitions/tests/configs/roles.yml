---
controller_roles:
  - name: Job template options
    permissions:
      - awx.change_jobtemplate
      - awx.delete_jobtemplate
      - awx.execute_jobtemplate
      - awx.view_jobtemplate
    content_type: awx.jobtemplate
    description: role definitions for Job Template
    state: present
  - name: Credential options
    permissions:
      - awx.change_credential
      - awx.delete_credential
      - awx.use_credential
      - awx.view_credential
    content_type: awx.credential
    description: role definitions for credentials
    state: present
  - name: EE options
    permissions:
      - awx.change_executionenvironment
      - awx.delete_executionenvironment
    content_type: awx.executionenvironment
    description: role definitions for execution environments
    state: present
  - name: Instance Group options
    permissions:
      - awx.change_instancegroup
      - awx.delete_instancegroup
      - awx.use_instancegroup
      - awx.view_instancegroup
    content_type: awx.instancegroup
    description: role definitions for instance groups
    state: present
  - name: Inventory Options
    permissions:
      - awx.adhoc_inventory
      - awx.change_inventory
      - awx.delete_inventory
      - awx.update_inventory
      - awx.use_inventory
      - awx.view_inventory
    content_type: awx.inventory
    description: role definitions for instance groups
    state: present

  - name: Notification Template Options
    permissions:
      - awx.change_notificationtemplate
      - awx.delete_notificationtemplate
      - awx.view_notificationtemplate
    content_type: awx.notificationtemplate
    description: role definitions for Notification Templates
    state: present

  - name: Organization Options
    permissions:
      - awx.add_credential
      - awx.change_credential
      - awx.delete_credential
      - awx.use_credential
      - awx.view_credential
      - awx.add_executionenvironment
      - awx.change_executionenvironment
      - awx.delete_executionenvironment
      - awx.add_inventory
      - awx.adhoc_inventory
      - awx.change_inventory
      - awx.delete_inventory
      - awx.update_inventory
      - awx.use_inventory
      - awx.view_inventory
      - awx.change_jobtemplate
      - awx.delete_jobtemplate
      - awx.execute_jobtemplate
      - awx.view_jobtemplate
      - awx.add_notificationtemplate
      - awx.change_notificationtemplate
      - awx.delete_notificationtemplate
      - awx.view_notificationtemplate
      - shared.view_organization
      - awx.add_project
      - awx.change_project
      - awx.delete_project
      - awx.update_project
      - awx.use_project
      - awx.view_project
      - awx.approve_workflowjobtemplate
      - awx.change_workflowjobtemplate
      - awx.delete_workflowjobtemplate
      - awx.execute_workflowjobtemplate
      - awx.view_workflowjobtemplate
    content_type: shared.organization
    description: role definitions for instance groups
    state: present

  - name: Project Options
    permissions:
      - awx.change_project
      - awx.delete_project
      - awx.update_project
      - awx.use_project
      - awx.view_project
    content_type: awx.project
    description: role definitions for Projects
    state: present

  - name: Workflow Job Template Options
    permissions:
      - awx.approve_workflowjobtemplate
      - awx.change_workflowjobtemplate
      - awx.delete_workflowjobtemplate
      - awx.execute_workflowjobtemplate
      - awx.view_workflowjobtemplate
    content_type: awx.workflowjobtemplate
    description: role definitions for Workflow Job Templates
    state: present
...

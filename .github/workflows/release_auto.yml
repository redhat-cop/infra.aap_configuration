---
# This workflow action will run pre-commit, which will execute ansible and yaml linting
# See .pre-commit-config.yaml for what hooks are executed
name: Release - Automated

on:
  schedule:
    - cron: "0 0 1,15 * *"
  workflow_dispatch:

jobs:
  calculate_version:
    name: Calculate Collection Version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2

      - name: Get the most recent tag
        uses: actions-ecosystem/action-get-latest-tag@v1
        id: get-latest-tag
        with:
          semver_only: true

      - name: Calculate bump level
        id: bump_level
        shell: bash
        run: .github/files/calculate_change.sh

      - name: Bump version
        uses: actions-ecosystem/action-bump-semver@v1
        id: bump-semver
        with:
          current_version: ${{ steps.get-latest-tag.outputs.tag }}
          level: ${{ steps.bump_level.outputs.level }}
    outputs:
      collection_version: ${{ steps.bump-semver.outputs.new_version }}
      change_level: ${{ steps.bump_level.outputs.level }}
      change_present: ${{ steps.bump_level.outputs.change_present }}

  create_github_release:
    name: Create GitHub Release
    needs: calculate_version
    runs-on: ubuntu-latest
    if: (needs.calculate_version.outputs.change_level != 'major' && needs.calculate_version.outputs.change_present != 'false') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Create Github Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ needs.calculate_version.outputs.collection_version }}
          generate_release_notes: true

  release:
    name: Release Collection to galaxy/AH
    needs: create_github_release
    if: (needs.calculate_version.outputs.change_level != 'major' && needs.calculate_version.outputs.change_present != 'false') || github.event_name == 'workflow_dispatch'
    uses: "redhat-cop/ansible_collections_tooling/.github/workflows/release_pipeline_dual.yml@main"
    with:
      # Galaxy Publish
      collection_namespace_1: infra
      collection_name_1: aap_configuration
      publish_url_collection_1: https://galaxy.ansible.com/api/
      galaxy_publish_1: true
      ah_publish_1: false
      # CRC Publish
      collection_namespace_2: infra
      collection_name_2: aap_configuration
      publish_url_collection_2: https://cloud.redhat.com/api/automation-hub/
      galaxy_publish_2: false
      ah_publish_2: true
      collection_version: ${{ needs.calculate_version.outputs.collection_version }}
      collection_repo: https://github.com/redhat-cop/aap_configuration/
      quay_username: redhat_cop
      collection_dependencies: ansible.controller ansible.platform ansible.eda ansible.hub
      matrix_message: This Ansible collection allows for easy interaction with an AWX or Ansible Controller server via Ansible roles using the AWX/Controller collection modules.
    secrets:
      collection_api_key_1: ${{ secrets.GALAXY_INFRA_KEY }}
      collection_api_key_2: ${{ secrets.CRC_PUBLISH_KEY }}
      git_token: ${{ secrets.GH_WORKFLOW_KEY }}
      quay_token: ${{ secrets.quay_token }}
      matrix_token: ${{ secrets.matrix_token }}
...

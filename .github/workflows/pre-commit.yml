---
name: pre-commit and sanity tests

on:
  push:
    branches: [devel]
  pull_request_target:
  schedule:
    - cron: "0 6 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check_pr_author:
    runs-on: ubuntu-latest
    permissions: {}
    env:
      # Add trusted GitHub user IDs through a reviewed PR and keep these labels in sync.
      # 15205330 = djdanielsson
      # 9056568  = Tompage1994
      # 30054029 = sean-m-sullivan
      # 13800082 = branic
      # 1304756  = lennysh
      # 26822043 = ivarmu
      TRUSTED_PR_USER_IDS: '[15205330, 9056568, 30054029, 13800082, 1304756, 26822043]'
    outputs:
      trusted: ${{ steps.trusted.outputs.approved }}
    steps:
      - name: Check whether the PR qualifies for automatic CI approval
        id: trusted
        # The author must own the fork. Both the author and event sender must be trusted.
        if: >-
          github.event_name == 'pull_request_target' &&
          github.event.pull_request.head.repo.fork == true &&
          github.event.pull_request.head.repo.owner.type == 'User' &&
          github.event.pull_request.head.sha != '' &&
          github.event.pull_request.user.id == github.event.pull_request.head.repo.owner.id &&
          contains(fromJSON(env.TRUSTED_PR_USER_IDS), github.event.pull_request.user.id) &&
          contains(fromJSON(env.TRUSTED_PR_USER_IDS), github.event.sender.id)
        run: echo "approved=true" >> "$GITHUB_OUTPUT"

  approve_run:
    needs: check_pr_author
    if: needs.check_pr_author.outputs.trusted != 'true'
    environment: requires-approval
    runs-on: ubuntu-latest
    steps:
      - run: echo "Approval granted."

  pre-commit:
    needs: [check_pr_author, approve_run]
    if: >-
      ${{ !cancelled() && needs.check_pr_author.result == 'success' &&
          (needs.approve_run.result == 'success' ||
           (needs.approve_run.result == 'skipped' && needs.check_pr_author.outputs.trusted == 'true')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          # Fork PRs need the head ref to lint PR changes. actions/checkout v7+ blocks
          # this by default in pull_request_target workflows; opt in after review:
          # https://gh.io/securely-using-pull_request_target
          # CI requires a trusted PR event or manual approval on approve_run.
          allow-unsafe-pr-checkout: true
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: |
            3.11
            3.12
            3.13
            3.14
      - name: Run default pre-commit hooks
        uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1
        env:
          ANSIBLE_GALAXY_SERVER_LIST: certified,galaxy
          ANSIBLE_GALAXY_SERVER_CERTIFIED_URL: https://console.redhat.com/api/automation-hub/content/published/
          ANSIBLE_GALAXY_SERVER_CERTIFIED_AUTH_URL: https://sso.redhat.com/auth/realms/redhat-external/protocol/openid-connect/token
          ANSIBLE_GALAXY_SERVER_CERTIFIED_TOKEN: ${{ secrets.CRC_PUBLISH_KEY }}
          ANSIBLE_GALAXY_SERVER_GALAXY_URL: https://galaxy.ansible.com/api/
      - name: Install system dependencies for EDA collection
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libsystemd-dev pkg-config libkrb5-dev
      - name: Run sanity (manual stage)
        uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1
        with:
          extra_args: --hook-stage manual sanity --all-files
        env:
          ANSIBLE_GALAXY_SERVER_LIST: certified,galaxy
          ANSIBLE_GALAXY_SERVER_CERTIFIED_URL: https://console.redhat.com/api/automation-hub/content/published/
          ANSIBLE_GALAXY_SERVER_CERTIFIED_AUTH_URL: https://sso.redhat.com/auth/realms/redhat-external/protocol/openid-connect/token
          ANSIBLE_GALAXY_SERVER_CERTIFIED_TOKEN: ${{ secrets.CRC_PUBLISH_KEY }}
          ANSIBLE_GALAXY_SERVER_GALAXY_URL: https://galaxy.ansible.com/api/
...
